[package]
name = "herdr-dog-relay"
version = "0.1.1"
edition = "2024"
# Keep Relay source and release builds on the fixed Rust baseline.
rust-version = "1.94.1"
license = "AGPL-3.0-or-later"
description = "Authenticated bounded byte relay for Herdr-dog Core"

[features]
default = []
# Enables the parent-owned Core/Relay contract-composition test support only.
contract-test-support = []

[lib]
name = "herdr_dog_relay"
path = "src/lib.rs"

[dependencies]
# The application Relay owns an iroh endpoint/Router; network-relay service code stays separate.
iroh = { version = "1.1.0", default-features = false, features = ["metrics", "tls-ring"] }
ipnet = { version = "2.11", features = ["serde"] }
libc = "0.2"
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fs2 = "0.4"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
sha2 = "0.10"
base64 = "0.22"
tar = "0.4"
flate2 = "1.1"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
time = { version = "0.3", features = ["local-offset"] }
toml = "0.9"
x509-parser = { version = "0.18", features = ["verify"] }

[[bin]]
name = "herdogrelay"
path = "src/bin/herdogrelay.rs"

[dev-dependencies]
rcgen = { version = "0.14", features = ["pem"] }
