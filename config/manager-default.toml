# Herdr-dog Manager v1 complete local configuration template.
# Manager mode is a user-level lifecycle controller; it does not parse Herdr API payloads.

# Root for Manager-owned state, session relay.toml files, and the persisted broker preference.
manager_root = "auto"
# Herdr configuration root. The resolver reads <root>/herdr/herdr.sock in release builds and
# <root>/herdr-dev/herdr.sock in debug builds; named sessions use sessions/<name>/herdr.sock.
herdr_config_root = "auto"
# The executable used for controlled relay-child mode. "auto" selects the running herdogrelay binary.
child_binary = "auto"
# The preferred Broker discovery port. RSB-2 persists this preference but does not open a Broker listener.
preferred_broker_port = 18743
# The number of bounded Broker discovery candidates shared with Core.
broker_port_attempts = 10
# The first session data port reserved by the future Broker data listener.
data_port_start = 18753
# The last session data port reserved by the future Broker data listener.
data_port_end = 18852
# The Core lease heartbeat interval in seconds.
heartbeat_interval_secs = 30
# The lease expiry interval after the last heartbeat in seconds.
lease_expiry_secs = 90
# The child idle grace period after the final lease is released in seconds.
idle_grace_secs = 300
