# Herdr-dog QRM-1 single-device QUIC Relay configuration.
# Every option is explicit. All certificate/key paths are placeholders and
# must be supplied by deployment outside the repository.

[listener]
# Explicit local UDP bind address. Loopback is the safe default.
listen_address = "127.0.0.1"
# One UDP listener per remote device. CLI --port overrides this value.
port = 18743

[security]
# verified is required for production. Every mode uses QUIC TLS 1.3.
mode = "verified"
# Non-secret trust-bundle generation. A CA cutover increments this value atomically.
ca_generation = 1
# Absolute path to the Relay certificate chain; never inline PEM.
server_certificate = ""
# Absolute path to the Relay private key; never commit or log this value.
server_private_key = ""
# Absolute path to the trusted App client CA used by normal QRM.
trusted_client_ca = "/path/to/herdr-dog/app-client-ca.pem"
# Absolute path to the trusted Core client CA used only by enrollment.
trusted_core_enrollment_ca = "/path/to/herdr-dog/core-enrollment-ca.pem"
# Absolute path to the Core-enrollment Intermediate certificate used by HDB1 issuance.
core_enrollment_intermediate_certificate = "/path/to/herdr-dog/core-enrollment-intermediate.pem"
# Absolute path to the Core-enrollment Intermediate private key; keep mode 0600.
core_enrollment_intermediate_private_key = "/path/to/herdr-dog/core-enrollment-intermediate.key"
# Absolute path to this device's App-client Intermediate CA certificate chain.
device_intermediate_certificate = "/path/to/herdr-dog/device-intermediate-chain.pem"
# Absolute path to this device's Intermediate CA private key; keep mode 0600.
device_intermediate_private_key = "/path/to/herdr-dog/device-intermediate.key"
# Absolute path to the public Root CA chain returned to enrolled Apps.
public_root_certificate = "/path/to/herdr-dog/deployment-root.pem"

[limits]
# Maximum number of Core device connections.
max_connections = 64
# Maximum number of active Herdr session streams per connection.
max_sessions_per_connection = 64
# Maximum complete HDQM control frame size in bytes.
max_control_frame_bytes = 65536
# Maximum bytes buffered in each bridge direction.
buffer_bytes = 65536
# Maximum TLS/control/session bind duration in seconds.
handshake_timeout_secs = 5
# Maximum QUIC connection idle duration in seconds.
idle_timeout_secs = 900

[enrollment]
# Enable the terminal same-port enrollment ALPN in production.
enabled = true
# Protected non-secret JSON allowlist path; do not place it in the repository.
allowlist_path = "/path/to/herdr-dog/allowlist.json"
# Protected bounded issuance-result record path for response-lost reconciliation.
issuance_result_path = "/path/to/herdr-dog/issuance-results.json"
# Protected restart-surviving HDB1 bootstrap metadata path.
bootstrap_state_path = "/path/to/herdr-dog/bootstrap-state.json"
# Maximum pre-authenticated TLS handshakes held at once.
max_handshakes = 16
# Maximum enrollment connections after ALPN selection.
max_connections = 8
# Maximum complete enrollment request bytes.
max_request_bytes = 65536
# Maximum raw CSR bytes retained only during one request.
max_csr_bytes = 16384
# Maximum enrollment connection lifetime in seconds, including human code entry.
connection_lifetime_secs = 330
# Maximum Relay challenge lifetime in seconds.
challenge_ttl_secs = 300
# Existing Herdr session used by the bounded bootstrap verifier; empty is not allowed.
bootstrap_session = "default"
# Remote absolute cwd for the hidden verification workspace.
bootstrap_verification_cwd = "/path/to/herdr-dog/bootstrap-verification"

[update]
# Enable the explicit stable-latest updater control surface.
enabled = true
# Fixed GitHub source; arbitrary repositories are rejected.
repository = "mithyer/herdr-dog-relay"
# Fixed update selector; only stable-latest is accepted.
channel = "stable-latest"
# Protected staging directory outside the installed binary directory.
staging_directory = "/path/to/herdr-dog/update-staging"
# Maximum downloaded archive bytes.
max_archive_bytes = 67108864
# Maximum extracted tree bytes.
max_extracted_bytes = 134217728
# Maximum extracted archive entries.
max_entries = 32
# Maximum archive decompression ratio.
max_compression_ratio = 100
