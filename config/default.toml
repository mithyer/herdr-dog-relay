# Herdr-dog QRM-1 single-device QUIC Relay configuration.
# Every option is explicit. All certificate/key paths are placeholders and
# must be supplied by deployment outside the repository.

[listener]
# Explicit local UDP bind address. Loopback is the safe default.
listen_address = "127.0.0.1"
# One UDP listener per remote device. CLI --port overrides this value.
port = 18743

[security]
# verified is required for production. Every mode uses QUIC TLS 1.3.
mode = "verified"
# Absolute path to the Relay certificate chain; never inline PEM.
server_certificate = ""
# Absolute path to the Relay private key; never commit or log this value.
server_private_key = ""
# Absolute path to the trusted Core client CA.
trusted_client_ca = ""

[limits]
# Maximum number of Core device connections.
max_connections = 64
# Maximum number of active Herdr session streams per connection.
max_sessions_per_connection = 64
# Maximum complete HDQM control frame size in bytes.
max_control_frame_bytes = 65536
# Maximum bytes buffered in each bridge direction.
buffer_bytes = 65536
# Maximum TLS/control/session bind duration in seconds.
handshake_timeout_secs = 5
# Maximum QUIC connection idle duration in seconds.
idle_timeout_secs = 900
